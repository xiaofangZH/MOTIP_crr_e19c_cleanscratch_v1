SUPER_CONFIG_PATH: ./configs/r50_deformable_detr_motip_dancetrack.yaml

DATASET_SPLITS: [crr_pointer_train8_v1]
SAMPLE_STEPS: [0]
SAMPLE_LENGTHS: [30]
SAMPLE_INTERVALS: [4]
NUM_WORKERS: 6
PREFETCH_FACTOR: 4
BATCH_SIZE: 1
EPOCHS: 3

USE_CAUSAL_HISTORY_PROTOTYPE: false
USE_CAUSAL_ENTITY_POINTER: true
TRAIN_ENTITY_POINTER_ONLY: true
DETR_NUM_TRAIN_FRAMES: 0
DETR_NUM_CHECKPOINT_FRAMES: 5

# Long-gap and NEW curriculum. Existing official random switching is replaced
# by a smaller, persistent state-corruption schedule in train.py.
AUG_TRAJECTORY_OCCLUSION_PROB: 0.15
AUG_TRAJECTORY_SWITCH_PROB: 0.0
POINTER_HISTORY_BLACKOUT_PROB: 0.60
POINTER_HISTORY_BLACKOUT_MIN: 2
POINTER_HISTORY_BLACKOUT_MAX: 12
POINTER_HISTORY_PREFIX_PROB: 0.25
POINTER_NEW_CLASS_WEIGHT: 1.5
POINTER_HISTORY_CORRUPTION_MAX_PROB: 0.15

LR: 0.0005
LR_WARMUP_EPOCHS: 0
SCHEDULER_MILESTONES: [2]
SCHEDULER_GAMMA: 0.2
WEIGHT_DECAY: 0.0001
MAX_CLIP_NORM: 1.0

# Epoch-wise closed-loop trend on the untouched internal train-side dev8 split.
INFERENCE_DATASET: DanceTrack
INFERENCE_SPLIT: motip_reset_dev8_v1
ASSIGNMENT_PROTOCOL: hungarian
DET_THRESH: 0.3
NEWBORN_THRESH: 0.6
ID_THRESH: 0.0
MISS_TOLERANCE: 30
INFERENCE_MAX_LONGER: 1440

SAVE_CHECKPOINT_PER_EPOCH: 1
USE_WANDB: false
